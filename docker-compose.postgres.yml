# Local PostgreSQL for M8 development and integration tests.
# Not a production deployment. Default credentials are documented examples
# in .env.example — do not reuse them in a real environment.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lsgc
      POSTGRES_PASSWORD: lsgc_dev
      POSTGRES_DB: lsgc
    ports:
      - "54329:5432"
    volumes:
      - lsgc_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lsgc -d lsgc"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  lsgc_pgdata:
